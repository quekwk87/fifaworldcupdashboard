name: Generate match pages

# Runs scripts/generate-match-pages.mjs to build/refresh one static page
# per match (fixtures + results + highlights once posted) and regenerate
# sitemap.xml, so search engines have stable, indexable URLs beyond the
# single-page app. See scripts/generate-match-pages.mjs for the full
# rationale and the throttling logic that bounds YouTube API quota use.

on:
  schedule:
    - cron: '0 6 * * *' # once daily, 6am UTC — catches the previous day's late highlights
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: generate-match-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate match pages
        run: node scripts/generate-match-pages.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches/ sitemap.xml scripts/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update match pages and sitemap [automated]"
            git push
          fi
