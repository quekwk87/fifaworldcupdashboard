<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Premier League — SGT/MYT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap');

  :root {
    --accent: #ff3b1f;            /* tweakable: #00e07b · #3d5afe · #f5c518 */
    --bg: #0b0b0c;
    --surface: #141416;
    --surface-2: #1a1a1f;
    --tile: #24242a;
    --border: #1f1f24;
    --border-soft: #17171a;
    --border-hard: #1c1c21;
    --t1: #f7f7f5;
    --t2: #c9c9cf;
    --t3: #8c8c93;
    --t4: #6f6f75;
    --t5: #5c5c62;
    --live: #00e07b;
    --yellow: #f5c518;
    --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --sans: 'Archivo', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    color: var(--t1);
    font-family: var(--sans);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
    padding-bottom: calc(74px + env(safe-area-inset-bottom));
  }

  button { font-family: inherit; cursor: pointer; }

  /* ---------- Header ---------- */
  .app-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 18px 20px 14px;
  }
  .wordmark {
    font-family: var(--cond);
    font-weight: 800;
    font-size: 30px;
    line-height: 0.9;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--t1);
  }
  .wordmark span { color: #7d7d82; }
  .tz {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--t4);
    text-align: right;
    padding-bottom: 3px;
    line-height: 1.5;
  }
  .tz .wk {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
    color: var(--t2);
  }
  .tz .wk button {
    background: none;
    border: none;
    color: var(--t3);
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
  }
  .tz .wk button:active { color: var(--accent); }

  /* ---------- Week strip (sticky) ---------- */
  .week-strip {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 6px;
    padding: 10px 20px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
  }
  .day-pill {
    flex: 1;
    border-radius: 8px;
    padding: 7px 0;
    text-align: center;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--t3);
    transition: background .12s, color .12s, border-color .12s;
  }
  .day-pill .dow {
    display: block;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .1em;
    opacity: .75;
  }
  .day-pill .num {
    display: block;
    font-family: var(--cond);
    font-weight: 700;
    font-size: 17px;
    line-height: 1;
    margin-top: 3px;
  }
  .day-pill.active {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
  }
  .day-pill.has-live .dow::after {
    content: '';
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--live);
    margin-left: 4px;
    vertical-align: middle;
  }

  /* ---------- Search ---------- */
  .search-wrap { padding: 12px 20px 4px; }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
    color: var(--t1);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: .02em;
  }
  .search-input::placeholder { color: var(--t5); }
  .search-input:focus { outline: none; border-color: #2b2b31; }

  /* ---------- Live hero ---------- */
  .hero {
    margin: 14px 20px 6px;
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 58%);
    pointer-events: none;
  }
  .hero-bar {
    height: 4px;
    background: var(--accent);
    clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  }
  .hero-body { position: relative; padding: 14px 18px 18px; }
  .hero-top {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 14px;
  }
  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 18%, transparent);
  }
  .live-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    color: var(--live);
  }
  .hero-mw {
    margin-left: auto;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .1em;
    color: var(--t4);
  }
  .hero-score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hero-team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 96px;
  }
  .hero-team .name {
    font-size: 12px;
    font-weight: 600;
    color: var(--t1);
    text-align: center;
  }
  .crest {
    width: 44px; height: 44px;
    border-radius: 8px;
    background: var(--tile);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--cond);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .04em;
    color: var(--t2);
    overflow: hidden;
    flex-shrink: 0;
  }
  .crest img { width: 30px; height: 30px; object-fit: contain; display: block; }
  .hero-score {
    font-family: var(--cond);
    font-weight: 800;
    font-size: 54px;
    line-height: 0.85;
    color: var(--t1);
    letter-spacing: .01em;
    text-align: center;
  }
  .hero-score .dash { color: #4a4a50; margin: 0 8px; }
  .hero-venue {
    margin-top: 8px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--t4);
    text-align: center;
  }
  .hero-cta {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  .hero-cta button {
    flex: 1;
    border-radius: 9px;
    padding: 11px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }
  .hero-cta .filled { background: var(--accent); color: #fff; }
  .hero-cta .outline { background: transparent; border-color: #2b2b31; color: var(--t2); }

  /* ---------- Day section + fixture list ---------- */
  .day-section { padding: 0 20px; }
  .day-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 0 6px;
  }
  .day-head .label {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--t1);
  }
  .day-head .rule { flex: 1; height: 1px; background: var(--border); }
  .day-head .count {
    font-size: 10px;
    font-weight: 500;
    color: var(--t4);
  }

  .fix-row {
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 4px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-soft);
  }
  .fix-time { width: 46px; flex-shrink: 0; }
  .fix-time .hm {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 17px;
    line-height: 1;
    color: var(--t1);
  }
  .fix-time .mer {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .08em;
    color: var(--t5);
    margin-top: 3px;
  }
  .fix-time .status {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .12em;
    margin-top: 3px;
  }
  .fix-time .status.live { color: var(--live); }
  .fix-time .status.ft { color: var(--t4); }
  .fix-divider {
    width: 2px;
    height: 30px;
    background: #242429;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .fix-teams { flex: 1; min-width: 0; }
  .fix-teams .team {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--t1);
    white-space: nowrap;
    overflow: hidden;
  }
  .fix-teams .team + .team { margin-top: 4px; }
  .fix-teams .team.dim { color: var(--t3); }
  .fix-teams .team .nm { overflow: hidden; text-overflow: ellipsis; }
  .fix-teams .team .mini {
    width: 16px; height: 16px;
    border-radius: 3px;
    background: var(--tile);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .fix-teams .team .mini img { width: 12px; height: 12px; object-fit: contain; }
  .fix-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    flex-shrink: 0;
  }
  .fix-score {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 20px;
    line-height: 1;
    color: var(--t1);
    white-space: nowrap;
  }
  .fix-score .dash { color: #4a4a50; margin: 0 5px; }
  .fix-badge {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .1em;
    color: var(--t4);
    border: 1px solid #26262c;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .fix-hl {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--accent);
  }

  .empty, .loading {
    padding: 60px 24px;
    text-align: center;
    color: var(--t4);
    font-size: 13px;
  }
  .empty strong { color: var(--t2); display: block; margin-bottom: 6px; font-weight: 600; }
  .api-notice {
    margin: 24px 20px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--t3);
    font-size: 12px;
    line-height: 1.6;
  }

  /* ---------- Bottom tab bar ---------- */
  .tab-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 430px;
    margin: 0 auto;
    display: flex;
    background: #0e0e10;
    border-top: 1px solid var(--border-hard);
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .tab-item {
    flex: 1;
    text-align: center;
    background: none;
    border: none;
    padding: 0;
  }
  .tab-item .ind {
    width: 20px; height: 3px;
    border-radius: 2px;
    background: transparent;
    margin: 0 auto 8px;
  }
  .tab-item .lbl {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--t5);
  }
  .tab-item.active .ind { background: var(--accent); }
  .tab-item.active .lbl { color: var(--t1); font-weight: 600; }

  #placeholderView { display: none; }
  #placeholderView.show { display: block; }
  #homeView.hide { display: none; }

  /* ---------- Highlights modal ---------- */
  .yt-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .yt-modal.open { display: flex; }
  .yt-modal-inner {
    width: 100%;
    max-width: 430px;
    max-height: 88vh;
    background: var(--surface);
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    border: 1px solid var(--border);
    border-bottom: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .yt-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-hard);
  }
  .yt-modal-title {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--t1);
  }
  .yt-close-btn {
    background: none; border: none;
    color: var(--t3);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
  }
  .yt-results {
    display: none;
    flex-direction: column;
    overflow-y: auto;
    padding: 8px;
  }
  .yt-result-item {
    display: flex;
    gap: 12px;
    padding: 10px;
    border-radius: 10px;
  }
  .yt-result-item:active { background: var(--surface-2); }
  .yt-result-thumb {
    width: 120px;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface-2);
    flex-shrink: 0;
  }
  .yt-result-info { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .yt-result-channel {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .yt-result-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--t2);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .yt-video-wrap {
    display: none;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
  }
  .yt-video-wrap iframe { width: 100%; height: 100%; border: 0; }
  .yt-status {
    padding: 28px 20px;
    text-align: center;
    color: var(--t4);
    font-size: 12px;
  }
  .yt-back-bar {
    display: none;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-hard);
  }
  .yt-back-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--t2);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 8px 14px;
  }
</style>
</head>
<body>

<div id="homeView">
  <header class="app-header">
    <div class="wordmark">Premier<br><span>League</span></div>
    <div class="tz">
      SGT / MYT · UTC+8
      <div class="wk">
        <button onclick="changeWeek(-1)" aria-label="Previous week">&lsaquo;</button>
        <span id="weekLabel">This week</span>
        <button onclick="changeWeek(1)" aria-label="Next week">&rsaquo;</button>
      </div>
    </div>
  </header>

  <div class="week-strip" id="weekStrip"></div>

  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Search team…" oninput="onSearch()">
  </div>

  <div id="heroSlot"></div>
  <div id="matchList"><div class="loading">Loading fixtures…</div></div>
</div>

<div id="placeholderView">
  <div class="empty" style="padding-top:120px">
    <strong id="phTitle">Table</strong>
    Coming soon — this build ships the Fixtures screen only.
  </div>
</div>

<nav class="tab-bar" id="tabBar">
  <button class="tab-item active" data-tab="fixtures" onclick="setTab('fixtures')"><span class="ind"></span><span class="lbl">Fixtures</span></button>
  <button class="tab-item" data-tab="table" onclick="setTab('table')"><span class="ind"></span><span class="lbl">Table</span></button>
  <button class="tab-item" data-tab="teams" onclick="setTab('teams')"><span class="ind"></span><span class="lbl">My Teams</span></button>
  <button class="tab-item" data-tab="watch" onclick="setTab('watch')"><span class="ind"></span><span class="lbl">Watch</span></button>
</nav>

<div id="ytModal" class="yt-modal" onclick="if(event.target===this)closeYtModal()">
  <div class="yt-modal-inner">
    <div class="yt-modal-header">
      <span class="yt-modal-title" id="ytModalTitle">Highlights</span>
      <button class="yt-close-btn" onclick="closeYtModal()">&#x2715;</button>
    </div>
    <div class="yt-results" id="ytResultsList"></div>
    <div class="yt-video-wrap" id="ytVideoWrap">
      <iframe id="ytIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="yt-status" id="ytStatus"></div>
    <div class="yt-back-bar" id="ytBackBar">
      <button class="yt-back-btn" onclick="showYtResults()">&#8592; Back to results</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Premier League fixtures — football-data.org free tier,
// proxied through a Cloudflare Worker (see worker.js).
// ============================================================
const PROXY_URL = 'https://silent-mode-cf93.quekwk.workers.dev';

// ---- State ----
let weekOffset = 0;
let selectedDay = 0;       // 0–6 index into the visible week
let allMatches = [];
let searchTerm = '';

// ---- Date helpers (all comparisons in SGT/MYT = UTC+8) ----
function getMondayUTC(d) {
  const day = d.getUTCDay();
  const diff = day === 0 ? -6 : 1 - day;
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + diff));
}
function getWeekRange(offset) {
  const monday = getMondayUTC(new Date());
  monday.setUTCDate(monday.getUTCDate() + offset * 7);
  const sunday = new Date(monday);
  sunday.setUTCDate(monday.getUTCDate() + 6);
  sunday.setUTCHours(23, 59, 59, 999);
  return { start: monday, end: sunday };
}
function toSGT(utcStr) {
  return new Date(new Date(utcStr).getTime() + 8 * 3600000);
}
function isoDate(d) {
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const DOW_FULL = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function fmtClock(d) {
  const h = d.getUTCHours(), m = d.getUTCMinutes();
  return { hm: `${h % 12 || 12}:${String(m).padStart(2,'0')}`, mer: h >= 12 ? 'PM' : 'AM' };
}
function fmtDayHead(d) {
  return `${DOW_FULL[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`;
}
const todayStr = isoDate(toSGT(new Date().toISOString()));

// ---- Week day list for the strip ----
function weekDays() {
  const { start } = getWeekRange(weekOffset);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setUTCDate(start.getUTCDate() + i);
    return d;
  });
}

// ---- Team rendering ----
function crestBig(team) {
  const code = team.tla || (team.shortName || team.name || '').slice(0, 3).toUpperCase();
  return team.crest
    ? `<div class="crest"><img src="${team.crest}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${code}'))"></div>`
    : `<div class="crest">${code}</div>`;
}
function crestMini(team) {
  return team.crest
    ? `<span class="mini"><img src="${team.crest}" alt="" loading="lazy"></span>`
    : `<span class="mini"></span>`;
}
function teamName(team) {
  return team.shortName || team.name || 'TBD';
}

// ---- API ----
async function fetchWeekMatches() {
  const list = document.getElementById('matchList');
  list.innerHTML = '<div class="loading">Loading fixtures…</div>';
  document.getElementById('heroSlot').innerHTML = '';
  updateWeekLabel();
  renderWeekStrip();

  const { start, end } = getWeekRange(weekOffset);
  try {
    const res = await fetch(`${PROXY_URL}?dateFrom=${isoDate(start)}&dateTo=${isoDate(end)}`);
    if (!res.ok) {
      list.innerHTML = `<div class="api-notice">API error ${res.status} — the fixtures service is unavailable right now.</div>`;
      return;
    }
    const data = await res.json();
    allMatches = data.matches || [];
    selectedDay = pickDefaultDay();
    render();
  } catch (e) {
    list.innerHTML = `<div class="api-notice">Could not load fixtures — check your connection and try again.</div>`;
    console.warn(e);
  }
}

function pickDefaultDay() {
  const days = weekDays();
  const counts = days.map(d => {
    const ds = isoDate(d);
    return allMatches.filter(m => isoDate(toSGT(m.utcDate)) === ds).length;
  });
  const todayIdx = days.findIndex(d => isoDate(d) === todayStr);
  if (todayIdx >= 0 && counts[todayIdx] > 0) return todayIdx;
  const firstWithMatches = counts.findIndex(c => c > 0);
  if (firstWithMatches >= 0) return firstWithMatches;
  return todayIdx >= 0 ? todayIdx : 0;
}

// ---- Navigation ----
function updateWeekLabel() {
  const { start, end } = getWeekRange(weekOffset);
  const el = document.getElementById('weekLabel');
  if (weekOffset === 0) { el.textContent = 'This week'; return; }
  const a = `${MON[start.getUTCMonth()]} ${start.getUTCDate()}`;
  const b = start.getUTCMonth() === end.getUTCMonth()
    ? `${end.getUTCDate()}`
    : `${MON[end.getUTCMonth()]} ${end.getUTCDate()}`;
  el.textContent = `${a} – ${b}`;
}
function changeWeek(delta) {
  weekOffset += delta;
  fetchWeekMatches();
}
function selectDay(i) {
  selectedDay = i;
  render();
}
function onSearch() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  render();
}
function setTab(tab) {
  document.querySelectorAll('.tab-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const home = document.getElementById('homeView');
  const ph = document.getElementById('placeholderView');
  if (tab === 'fixtures') {
    home.classList.remove('hide');
    ph.classList.remove('show');
  } else {
    home.classList.add('hide');
    ph.classList.add('show');
    document.getElementById('phTitle').textContent =
      { table: 'Table', teams: 'My Teams', watch: 'Watch' }[tab];
  }
}

// ---- Match status ----
function statusOf(m) {
  if (m.status === 'IN_PLAY') return 'live';
  if (m.status === 'PAUSED') return 'ht';
  if (m.status === 'FINISHED' || m.status === 'AWARDED') return 'ft';
  return 'upcoming';
}
function goals(m) {
  const s = m.score || {};
  const h = s.fullTime?.home ?? s.regularTime?.home ?? null;
  const a = s.fullTime?.away ?? s.regularTime?.away ?? null;
  return { h, a };
}

// ---- Render ----
function render() {
  renderWeekStrip();
  renderHero();
  renderList();
}

function renderWeekStrip() {
  const strip = document.getElementById('weekStrip');
  const days = weekDays();
  strip.innerHTML = days.map((d, i) => {
    const ds = isoDate(d);
    const hasLive = allMatches.some(m =>
      isoDate(toSGT(m.utcDate)) === ds && (statusOf(m) === 'live' || statusOf(m) === 'ht'));
    return `<button class="day-pill${i === selectedDay ? ' active' : ''}${hasLive ? ' has-live' : ''}" onclick="selectDay(${i})">
      <span class="dow">${DOW[d.getUTCDay()]}</span>
      <span class="num">${d.getUTCDate()}</span>
    </button>`;
  }).join('');
}

function renderHero() {
  const slot = document.getElementById('heroSlot');
  const live = allMatches.find(m => statusOf(m) === 'live' || statusOf(m) === 'ht');
  if (!live) { slot.innerHTML = ''; return; }

  const { h, a } = goals(live);
  const st = statusOf(live);
  const label = st === 'ht' ? 'HALF TIME' : (live.minute ? `LIVE · ${live.minute}'` : 'LIVE');
  const venue = live.venue ? `<div class="hero-venue">${live.venue.toUpperCase()}</div>` : '';

  slot.innerHTML = `
    <div class="hero">
      <div class="hero-bar"></div>
      <div class="hero-body">
        <div class="hero-top">
          <span class="live-dot"></span>
          <span class="live-label">${label}</span>
          <span class="hero-mw">MATCHWEEK ${live.matchday}</span>
        </div>
        <div class="hero-score-row">
          <div class="hero-team">
            ${crestBig(live.homeTeam)}
            <div class="name">${teamName(live.homeTeam)}</div>
          </div>
          <div>
            <div class="hero-score">${h ?? 0}<span class="dash">–</span>${a ?? 0}</div>
            ${venue}
          </div>
          <div class="hero-team">
            ${crestBig(live.awayTeam)}
            <div class="name">${teamName(live.awayTeam)}</div>
          </div>
        </div>
      </div>
    </div>`;
}

function matchVisible(m, ds) {
  if (isoDate(toSGT(m.utcDate)) !== ds) return false;
  if (searchTerm) {
    const hay = [m.homeTeam.shortName, m.homeTeam.name, m.awayTeam.shortName, m.awayTeam.name]
      .filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(searchTerm)) return false;
  }
  return true;
}

function renderList() {
  const list = document.getElementById('matchList');
  const day = weekDays()[selectedDay];
  const ds = isoDate(day);
  const heroMatch = allMatches.find(m => statusOf(m) === 'live' || statusOf(m) === 'ht');

  const matches = allMatches
    .filter(m => matchVisible(m, ds))
    .filter(m => !heroMatch || m.id !== heroMatch.id)
    .sort((x, y) => new Date(x.utcDate) - new Date(y.utcDate));

  if (matches.length === 0) {
    list.innerHTML = `<div class="empty"><strong>No fixtures</strong>${
      searchTerm ? 'No match for that search on this day.' : 'Nothing scheduled for ' + fmtDayHead(day).toLowerCase() + '.'
    }</div>`;
    return;
  }

  const rows = matches.map(m => {
    const sgt = toSGT(m.utcDate);
    const st = statusOf(m);
    const { h, a } = goals(m);
    const scored = h !== null && a !== null;
    const isFinished = st === 'ft';
    const tag = isFinished ? 'button' : 'div';
    const onclick = isFinished ? ` data-hl="${m.id}"` : '';

    // left block
    let left;
    if (st === 'live' || st === 'ht') {
      left = `<div class="hm">${m.minute ? m.minute + "'" : ''}</div><div class="status live">${st === 'ht' ? 'HALF TIME' : 'LIVE'}</div>`;
    } else if (isFinished) {
      left = `<div class="hm" style="color:var(--t3)">FT</div>`;
    } else {
      const c = fmtClock(sgt);
      left = `<div class="hm">${c.hm}</div><div class="mer">${c.mer} · SGT</div>`;
    }

    // right block
    let right;
    if (scored) {
      right = `<div class="fix-score">${h}<span class="dash">–</span>${a}</div>${
        isFinished ? '<span class="fix-hl">▶ HIGHLIGHTS</span>' : ''}`;
    } else {
      right = `<span class="fix-badge">MW ${m.matchday}</span>${
        m.venue ? `<span class="fix-badge" style="border:none;padding:0">${m.venue}</span>` : ''
      }`;
    }

    return `<${tag} class="fix-row"${onclick}>
      <div class="fix-time">${left}</div>
      <div class="fix-divider"></div>
      <div class="fix-teams">
        <div class="team${scored && a > h ? ' dim' : ''}">${crestMini(m.homeTeam)}<span class="nm">${teamName(m.homeTeam)}</span></div>
        <div class="team${scored && h > a ? ' dim' : ''}">${crestMini(m.awayTeam)}<span class="nm">${teamName(m.awayTeam)}</span></div>
      </div>
      <div class="fix-right">${right}</div>
    </${tag}>`;
  }).join('');

  list.innerHTML = `<div class="day-section">
    <div class="day-head">
      <span class="label">${fmtDayHead(day)}</span>
      <span class="rule"></span>
      <span class="count">${matches.length} ${matches.length === 1 ? 'match' : 'matches'}</span>
    </div>
    ${rows}
  </div>`;

  list.querySelectorAll('[data-hl]').forEach(el => {
    const m = allMatches.find(x => String(x.id) === el.dataset.hl);
    if (!m) return;
    el.onclick = () => loadHighlight(
      `${m.matchday}-${m.homeTeam.id}-${m.awayTeam.id}`,
      m.homeTeam.name, m.awayTeam.name, m.utcDate);
  });
}

// ============================================================
// YouTube highlights modal
// ============================================================
const ytCache = {};

function showYtModal(title) {
  document.getElementById('ytModalTitle').textContent = title;
  document.getElementById('ytModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeYtModal() {
  document.getElementById('ytModal').classList.remove('open');
  document.getElementById('ytIframe').src = '';
  document.getElementById('ytVideoWrap').style.display = 'none';
  document.getElementById('ytResultsList').style.display = 'none';
  document.getElementById('ytStatus').innerHTML = '';
  document.getElementById('ytBackBar').style.display = 'none';
  document.body.style.overflow = '';
}
function showYtResults(items) {
  const listEl = document.getElementById('ytResultsList');
  const cached = items || listEl._items;
  if (!cached) return;
  listEl._items = cached;
  listEl.innerHTML = '';
  cached.forEach(item => {
    const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || '';
    const el = document.createElement('div');
    el.className = 'yt-result-item';
    el.innerHTML = `
      ${thumb ? `<img class="yt-result-thumb" src="${thumb}" alt="" loading="lazy">` : ''}
      <div class="yt-result-info">
        <div class="yt-result-channel">${item.snippet.channelTitle}</div>
        <div class="yt-result-title">${item.snippet.title}</div>
      </div>`;
    el.onclick = () => playYtVideo(item.id.videoId);
    listEl.appendChild(el);
  });
  listEl.style.display = 'flex';
  document.getElementById('ytVideoWrap').style.display = 'none';
  document.getElementById('ytBackBar').style.display = 'none';
  document.getElementById('ytStatus').innerHTML = '';
}
function playYtVideo(videoId) {
  document.getElementById('ytResultsList').style.display = 'none';
  document.getElementById('ytStatus').innerHTML = '';
  document.getElementById('ytVideoWrap').style.display = '';
  document.getElementById('ytIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  document.getElementById('ytBackBar').style.display = '';
}
async function loadHighlight(matchKey, homeTeam, awayTeam, matchDate) {
  showYtModal(`${homeTeam} vs ${awayTeam}`);
  if (ytCache[matchKey]) { showYtResults(ytCache[matchKey]); return; }
  document.getElementById('ytResultsList').style.display = 'none';
  document.getElementById('ytVideoWrap').style.display = 'none';
  document.getElementById('ytBackBar').style.display = 'none';
  document.getElementById('ytStatus').textContent = 'Searching for highlights…';
  try {
    const res = await fetch(
      `${PROXY_URL}/highlights?home=${encodeURIComponent(homeTeam)}&away=${encodeURIComponent(awayTeam)}&date=${encodeURIComponent(matchDate)}`
    );
    const data = await res.json();
    if (data.error) {
      document.getElementById('ytStatus').textContent = `Error: ${data.error.message || data.error}`;
      return;
    }
    if (!data.items || data.items.length === 0) {
      document.getElementById('ytStatus').textContent = 'No highlights found yet — check back after the match.';
      return;
    }
    ytCache[matchKey] = data.items;
    showYtResults(data.items);
  } catch (e) {
    document.getElementById('ytStatus').textContent = 'Could not load highlights.';
    console.warn(e);
  }
}

fetchWeekMatches();
</script>
